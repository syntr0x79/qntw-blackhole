# Additive HTTP metadata. Credential-bearing paths are redacted by receiver
# before persistence. No query arguments, cookies, authorization or bodies.
log_format qntw_probe escape=json
  '{"event":"http","epoch":"$msec","client":"$remote_addr",'
  '"peer":"$realip_remote_addr","client_port":"$remote_port",'
  '"server":"$server_addr","port":"$server_port","connection":"$connection",'
  '"connection_requests":"$connection_requests","host":"$host",'
  '"sni":"$ssl_server_name","tls":"$ssl_protocol","cipher":"$ssl_cipher",'
  '"request":"$request","uri":"$uri","status":"$status",'
  '"request_bytes":"$request_length","response_bytes":"$bytes_sent",'
  '"seconds":"$request_time","user_agent":"$http_user_agent"}';
access_log syslog:server=unix:/run/vpnshop-probes/nginx.sock,tag=qntw_http,nohostname qntw_probe;
error_log syslog:server=unix:/run/vpnshop-probes/nginx.sock,tag=qntw_error,nohostname info;
